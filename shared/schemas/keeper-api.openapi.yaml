openapi: 3.1.0
info:
  title: Hermit Keeper local API
  version: 0.1.0
  description: >
    Served by each keeper on 127.0.0.1:<api.port> (default 47800). No auth: loopback only.
    Non-loopback origins must be rejected. Consumed by the critter, the sim and scripts.
servers:
  - url: http://127.0.0.1:47800
paths:
  /v1/health:
    get:
      summary: Liveness
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
  /v1/status:
    get:
      summary: What Hermit is doing on this host right now
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /v1/events:
    get:
      summary: SSE stream of event envelopes
      responses:
        "200":
          content:
            text/event-stream:
              schema: { type: string }
  /v1/group:
    get:
      summary: Every laptop in the group, as this keeper last saw it
      description: >
        Folded from the shared ledger room, so any keeper can answer it and
        the desktop critter needs no extra service. `soul_holder` is shared
        state owned by Switch; each host's `present` is local to that machine.
        A host we have not heard from within the staleness window is reported
        `stale: true` with mood `offline` rather than guessed at.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
  /v1/group/status:
    get:
      summary: Alias of /v1/group
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
  /v1/shell:
    get:
      summary: All shell pieces known to this host
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  pieces:
                    type: array
                    items: { type: object }
  /v1/presence/override:
    post:
      summary: Force presence (sim, tests, demo)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { enum: [auto, awake, asleep] }
      responses:
        "200": { description: applied }
  /v1/claim:
    post:
      summary: Take Hermit, if it is free
      description: >
        Skips the fairness delay and the post-handover stand-aside. Cannot
        take Hermit from a current holder - only a free soul is claimable -
        so the worst outcome is being told no.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reason: { type: string }
  /v1/depart:
    post:
      summary: Trigger a graceful departure ("I'm busy")
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { enum: [manual] }
      responses:
        "202": { description: departure started }
  /v1/metrics:
    get:
      summary: Handoff latencies and counters
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  handoffs:
                    type: array
                    items:
                      type: object
                      properties:
                        from: { type: [string, "null"] }
                        to: { type: string }
                        latency_ms: { type: integer }
components:
  schemas:
    Group:
      type: object
      required: [v, generated_at, soul_holder, hosts]
      properties:
        v: { const: 1 }
        generated_at: { type: string, format: date-time }
        self: { type: [string, "null"], description: the host serving this }
        soul_holder:
          type: [string, "null"]
          description: >
            null when free, when the holder has gone stale, or when Switch is
            unreachable (unknown — see `switch`)
        switch:
          $ref: "#/components/schemas/SwitchState"
        hosts:
          type: array
          items:
            type: object
            required: [host_id, mood, stale, holding]
            properties:
              host_id: { type: string }
              state: { type: [string, "null"] }
              present: { type: [boolean, "null"] }
              mood: { enum: [arriving, visiting, away, sleeping, waiting, offline] }
              last_seen: { type: [string, "null"], format: date-time }
              stale: { type: boolean }
              holding: { type: boolean }
    Status:
      type: object
      required: [host, state, present, soul_holder, mood]
      properties:
        host: { type: string }
        state:
          enum: [ASLEEP, AWAKE_WAITING, CLAIMING, HOLDING, DEPARTING, BEDTIME_LOCK]
        present: { type: boolean }
        soul_holder: { type: [string, "null"] }
        since: { type: [string, "null"], format: date-time }
        mood:
          description: >
            Which mascot this laptop should draw. Every laptop has one, not
            just the host: a laptop that is awake while Hermit is elsewhere
            shows `waiting`, and one we cannot hear from shows `offline`.
            Only the soul holder is ever `visiting`.
          enum: [arriving, visiting, away, sleeping, waiting, offline]
        favor_pending: { type: [object, "null"] }
        last_line: { type: [string, "null"] }
        switch:
          $ref: "#/components/schemas/SwitchState"
    SwitchState:
      description: >
        Additive. Whether this keeper can currently hear Switch. `online`: the
        keeper's event poll is succeeding. `offline`: Switch is unreachable, so
        nobody's claim can be verified — `soul_holder` is reported null
        (unknown, not stale) and no host is reported `arriving`/`visiting`.
        `fake`: this keeper runs the offline fake lease and no Switch is
        involved. Absent from older keepers; treat absence as unknown.
      enum: [online, offline, fake]
