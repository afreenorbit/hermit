# Copy to hermit.config.toml and edit. NEVER commit the real file.
#   cp hermit.config.example.toml hermit.config.toml

host_id        = "afreen"
display_name   = "Afreen"
city           = "Bengaluru"
lat            = 12.97
lon            = 77.59
timezone       = "Asia/Kolkata"

brain_agent    = "hermit-afreen"
brain_provider = "claude-code"        # afreen=claude-code, abhishek=opencode, akshay=codex
window_dir     = "~/HermitWindow"     # the only folder Hermit's brain can see

[presence]
idle_threshold_s   = 300              # no input for 5 min => idle
arrive_debounce_s  = 60               # must be present 60s before claiming the soul
min_dwell_s        = 600              # hold at least 10 min before a voluntary handoff
sleep_gap_s        = 90               # heartbeat gap bigger than this => the machine slept

[bedtime]
start = "01:00"
end   = "06:00"
grace_idle_s = 120                    # after bedtime, leave after 2 min idle

[switch]
server_url     = "http://127.0.0.1:8000"   # Switch API; over Tailscale use http://100.x.y.z:8000
den_room       = "hermit-den"
ledger_room    = "hermit-ledger"
token_env      = "HERMIT_SWITCH_TOKEN"     # your keeper agent's api_key lives in this env var, not here
lease_strategy = "fake"                    # agent_instructed | fake
# agent_instructed: your brain assumes the "soul" role itself when cued.
# fake: offline, nothing leaves this machine. Good for UI work and demos.
lease_expiry_s = 8                         # GUESS until measured: how long Switch takes to free the soul after a lid slam

# Needed for agent_instructed. bootstrap_rooms.py prints these (never the key):
# agent_id     = "<your keeper-<host_id> agent uuid>"
# brain_agent_id = "<only if Switch reports senders by uuid>"
#
# [switch.rooms]
# hermit-den    = "<den room uuid>"
# hermit-ledger = "<ledger room uuid>"

[features]
overlap = false
nudge   = false
critter = true

[api]
port = 47800                               # keeper local API, 127.0.0.1 only
