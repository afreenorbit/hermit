# A host up past bedtime. Hermit leaves and does not come back until morning,
# however awake they are. Staying up is never rewarded.
#
# Starts at 00:00 IST, so afreen is inside her 01:00-06:00 window almost at
# once while abhishek's bedtime is set later and he can still host.
name: bedtime_eviction
duration_s: 43200
lease_expiry_s: 8
hosts:
  - host_id: afreen
    brain_provider: claude-code
    city: Indiranagar
    timezone: Asia/Kolkata
    bedtime_start: "01:00"
    bedtime_end: "06:00"
    presence: [[0, true]]
  - host_id: abhishek
    brain_provider: opencode
    city: Kengeri
    timezone: Asia/Kolkata
    bedtime_start: "03:00"
    bedtime_end: "05:00"
    presence: [[0, true]]
assertions:
  - never_two_holders
  - no_claim_during_bedtime
  - min_handoffs: 1
