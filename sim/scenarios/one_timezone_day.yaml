# PRIMARY scenario — our actual group: three friends in Bengaluru.
#
# Hermit follows attention, not daylight. Nobody crosses a timezone here; the
# soul moves because one of us is in class, one is commuting, one is up late.
# Handoffs are rarer than three_cities_day and that is the honest result.
