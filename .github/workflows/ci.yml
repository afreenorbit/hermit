name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  keeper:
    name: keeper (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not live" -q

  ui:
    name: ui (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json "packageManager"; naming it
      # here as well makes the action refuse to start.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  map-e2e:
    name: map e2e (playwright)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from package.json "packageManager"; naming it
      # here as well makes the action refuse to start.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hermit/map...
      - run: pnpm --filter @hermit/map exec playwright install --with-deps chromium
      # builds the static site (relative base) and serves it the way a host would
      - run: pnpm --filter @hermit/map e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: map-e2e-traces
          path: map/test-results
          retention-days: 7
